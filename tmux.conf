set -g mouse on

# give the session name (status-left) room so it isn't truncated at 10 chars
set -g status-left-length 40

# set base index to 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set true color
set-option -sa terminal-features ",xterm*:RGB"

# allow passthrough for image rendering
set -g allow-passthrough on

# allow passthrough for image display
set -g allow-passthrough on

# set leader to be ctrl space
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# navigate windows with alt jk
bind -n M-j previous-window
bind -n M-k next-window

# navigate sessions (terminal window groups) with alt hl
bind -n M-h switch-client -n
bind -n M-l switch-client -p

# when the attached session is killed (e.g. 'x' in the tree view), switch to
# the next session instead of detaching/closing tmux
set -g detach-on-destroy off

# session management
bind -n M-n new-session  # Alt+n = new session (will prompt for name)
bind -n M-s choose-session  # Alt+s = session switcher

# sort the session tree (<leader>s) by name so numeric prefixes drive order
bind s choose-tree -Zs -O name

# fuzzy-switch to a session or spin up a repo as a new session (sessionizer)
bind -n M-f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer.sh"

# move windows left and right with ctrl alt jk
bind-key -n C-M-j swap-window -t -1\; select-window -t -1
bind-key -n C-M-k swap-window -t +1\; select-window -t +1

# navigate terminal with vim motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# key bindings reference:
# Sessions:
# - prefix then :new : create new session
# - prefix then $ : rename current session
# - prefix then d : detach from current session
# - prefix then s : switch between sessions (interactive list)
# - alt+h / alt+l : navigate to previous/next session
# Windows (tabs):
# - prefix then c : create new window
# - prefix then , : rename current window
# - prefix then & : kill current window
# - alt+j / alt+k : navigate to previous/next window
# - ctrl+alt+j / ctrl+alt+k : move current window left/right
# Panes (splits):
# - prefix then % : split pane horizontally
# - prefix then " : split pane vertically
# - prefix then x : kill current pane
# - ctrl+h/j/k/l : navigate between panes (vim-tmux-navigator)
# Copy mode:
# - prefix then [ : enter copy mode (navigate with vim keys, press q to exit)
# - prefix then ] : paste copied text
# Other:
# - prefix (ctrl+space) then ? : show all key bindings

# install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save pane contents and restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# continuum: auto-save every 15 min and auto-restore on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# tmux-dotbar colors follow the macOS system appearance (dark = original look,
# light = a readable variant). Runs before tpm so dotbar picks up the right
# colors at startup; re-run with <prefix> R after flipping the system theme.
run-shell "~/.config/tmux/theme-detect.sh"

# Performance optimizations
set -g focus-events on
set -s escape-time 0

run '~/.tmux/plugins/tpm/tpm'

# re-detect system light/dark and recolor the status bar
bind R run-shell "~/.config/tmux/theme-detect.sh" \; display-message "tmux theme re-detected"

